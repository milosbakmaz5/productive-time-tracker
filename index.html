<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productive Time Tracker</title>
    <script>
      // Applies a stored theme override before first paint, so there's no flash of the wrong
      // theme while React loads. No stored value = no attribute = CSS falls through to the
      // prefers-color-scheme media query in index.css.
      try {
        var theme = localStorage.getItem('productive-time-tracker:theme')
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
